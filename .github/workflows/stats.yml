name: Trading-Statistik aktualisieren

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Statistik aus Notion holen
        env:
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: node scripts/update-stats.mjs
      - name: Änderungen speichern
        run: |
          if [ -n "$(git status --porcelain stats.enc.json)" ]; then
            git config user.name "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add stats.enc.json
            git commit -m "Statistik aktualisiert"
            git push
          fi
